# --- Server Settings ---
server.port=8080

# --- PostgreSQL Connection ---
spring.datasource.url=jdbc:postgresql://localhost:5433/notification_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate will automatically update the database schema on startup
spring.jpa.hibernate.ddl-auto=update
# Print SQL queries to the console (useful for learning)
spring.jpa.show-sql=true

# --- Kafka Settings ---
spring.kafka.bootstrap-servers=localhost:9092

# Producer Settings (for sending messages)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer Settings (for reading messages)
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# IMPORTANT: Allow Spring to deserialize JSON back into our Java classes (prevents security errors)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.notification_service.model
# Use type headers embedded in Kafka messages
spring.kafka.consumer.properties.spring.json.use.type.headers=true